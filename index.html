<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Currency Convertor</title>
  <style>
    :root {
      --ink: #17233c;
      --muted: #74809a;
      --purple: #6558e8;
      --line: #e4e8f2;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 14px;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 15%, rgba(125,111,255,.18), transparent 28%),
        radial-gradient(circle at 90% 85%, rgba(93,190,220,.16), transparent 30%),
        #f2f4fb;
    }

    .converter-card {
      width: min(100%, 560px);
      padding: 34px;
      border: 1px solid rgba(255,255,255,.9);
      border-radius: 26px;
      background: rgba(255,255,255,.96);
      box-shadow: 0 24px 70px rgba(38,48,94,.12);
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      border-radius: 15px;
      color: white;
      font-size: 28px;
      background: linear-gradient(135deg, #7d72ff, #5145d5);
      box-shadow: 0 8px 20px rgba(101,88,232,.28);
    }

    .eyebrow {
      margin: 23px 0 8px;
      color: var(--purple);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    h1 { margin: 0; font-size: clamp(27px, 5vw, 35px); letter-spacing: -1px; }
    .subtitle { margin: 12px 0 27px; color: var(--muted); font-size: 14px; line-height: 1.6; }
    label { display: block; margin-bottom: 9px; color: #46516b; font-size: 13px; font-weight: 700; }

    input, select {
      width: 100%;
      min-width: 0;
      height: 50px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      outline: none;
      background: #fff;
      color: var(--ink);
      font: inherit;
      font-size: 14px;
    }

    input:focus, select:focus { border-color: var(--purple); box-shadow: 0 0 0 3px rgba(101,88,232,.12); }

    .currency-row {
      display: grid;
      grid-template-columns: minmax(0,1fr) 42px minmax(0,1fr);
      align-items: end;
      gap: 9px;
      margin-top: 20px;
    }

    .swap-button {
      width: 42px;
      height: 42px;
      margin-bottom: 4px;
      border: 1px solid #e1defe;
      border-radius: 12px;
      color: var(--purple);
      background: #f3f1ff;
      font-size: 24px;
      cursor: pointer;
    }

    .convert-button {
      width: 100%;
      height: 53px;
      margin-top: 23px;
      border: 0;
      border-radius: 13px;
      color: white;
      background: linear-gradient(110deg, #7165f4, #584bdc);
      box-shadow: 0 10px 22px rgba(101,88,232,.24);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .convert-button:hover { filter: brightness(1.04); }
    .convert-button:disabled { opacity: .7; cursor: wait; }

    .result-panel {
      margin-top: 25px;
      padding: 22px;
      border: 1px solid #e8e6ff;
      border-radius: 17px;
      background: linear-gradient(135deg, #f7f6ff, #f4f9ff);
    }

    .result-label { margin: 0 0 9px; color: #7770c5; font-size: 10px; font-weight: 700; letter-spacing: 1.8px; }
    #result { margin: 0; overflow-wrap: anywhere; font-size: clamp(27px, 6vw, 36px); letter-spacing: -1px; }
    #rate-text { margin: 10px 0 0; color: #68738d; font-size: 12px; line-height: 1.5; }
    #status { min-height: 18px; margin: 14px 0 0; color: #68738d; font-size: 12px; text-align: center; }
    #status.error { color: #bd3448; }
    .disclaimer { margin: 15px 0 0; color: #929bb0; font-size: 11px; line-height: 1.5; text-align: center; }

    @media (max-width: 440px) {
      .converter-card { padding: 24px 18px; border-radius: 21px; }
      .currency-row { grid-template-columns: minmax(0,1fr) 36px minmax(0,1fr); gap: 6px; }
      .swap-button { width: 36px; font-size: 20px; }
      select { padding: 0 6px; font-size: 11px; }
    }
  </style>
</head>
<body>
  <main class="converter-card">
    <div class="brand-mark" aria-hidden="true">↔</div>
    <p class="eyebrow">SMART MONEY TOOLS</p>
    <h1>Currency Convertor</h1>
    <p class="subtitle">Convert currencies using the latest available exchange rates.</p>

    <form id="converter-form">
      <label for="amount">Amount</label>
      <input id="amount" type="number" min="0" step="any" value="100" required>

      <div class="currency-row">
        <div>
          <label for="from-currency">From</label>
          <select id="from-currency" aria-label="Convert from currency">
            <option value="USD">🇺🇸 USD — US Dollar</option>
            <option value="INR" selected>🇮🇳 INR — Indian Rupee</option>
            <option value="EUR">🇪🇺 EUR — Euro</option>
            <option value="GBP">🇬🇧 GBP — British Pound</option>
            <option value="JPY">🇯🇵 JPY — Japanese Yen</option>
            <option value="AUD">🇦🇺 AUD — Australian Dollar</option>
            <option value="CAD">🇨🇦 CAD — Canadian Dollar</option>
            <option value="SGD">🇸🇬 SGD — Singapore Dollar</option>
            <option value="CNY">🇨🇳 CNY — Chinese Yuan</option>
            <option value="AED">🇦🇪 AED — UAE Dirham</option>
            <option value="CHF">🇨🇭 CHF — Swiss Franc</option>
            <option value="NZD">🇳🇿 NZD — New Zealand Dollar</option>
            <option value="KRW">🇰🇷 KRW — South Korean Won</option>
            <option value="BRL">🇧🇷 BRL — Brazilian Real</option>
            <option value="ZAR">🇿🇦 ZAR — South African Rand</option>
          </select>
        </div>
        <button type="button" id="swap-button" class="swap-button" aria-label="Swap currencies" title="Swap currencies">⇄</button>
        <div>
          <label for="to-currency">To</label>
          <select id="to-currency" aria-label="Convert to currency">
            <option value="USD" selected>🇺🇸 USD — US Dollar</option>
            <option value="INR">🇮🇳 INR — Indian Rupee</option>
            <option value="EUR">🇪🇺 EUR — Euro</option>
            <option value="GBP">🇬🇧 GBP — British Pound</option>
            <option value="JPY">🇯🇵 JPY — Japanese Yen</option>
            <option value="AUD">🇦🇺 AUD — Australian Dollar</option>
            <option value="CAD">🇨🇦 CAD — Canadian Dollar</option>
            <option value="SGD">🇸🇬 SGD — Singapore Dollar</option>
            <option value="CNY">🇨🇳 CNY — Chinese Yuan</option>
            <option value="AED">🇦🇪 AED — UAE Dirham</option>
            <option value="CHF">🇨🇭 CHF — Swiss Franc</option>
            <option value="NZD">🇳🇿 NZD — New Zealand Dollar</option>
            <option value="KRW">🇰🇷 KRW — South Korean Won</option>
            <option value="BRL">🇧🇷 BRL — Brazilian Real</option>
            <option value="ZAR">🇿🇦 ZAR — South African Rand</option>
          </select>
        </div>
      </div>

      <button class="convert-button" id="convert-button" type="submit">Convert currency →</button>
    </form>

    <section class="result-panel" aria-live="polite">
      <p class="result-label">CONVERTED AMOUNT</p>
      <h2 id="result">—</h2>
      <p id="rate-text">Choose currencies and convert.</p>
    </section>
    <p id="status" role="status">An internet connection is needed to load exchange rates.</p>
    <p class="disclaimer">Rates are indicative and may differ from bank or card provider rates.</p>
  </main>

  <script>
    const form = document.getElementById('converter-form');
    const amountInput = document.getElementById('amount');
    const fromSelect = document.getElementById('from-currency');
    const toSelect = document.getElementById('to-currency');
    const swapButton = document.getElementById('swap-button');
    const result = document.getElementById('result');
    const rateText = document.getElementById('rate-text');
    const statusText = document.getElementById('status');
    const convertButton = document.getElementById('convert-button');

    function formatMoney(value, currency) {
      return new Intl.NumberFormat('en', {
        style: 'currency',
        currency,
        maximumFractionDigits: 4
      }).format(value);
    }

    function setStatus(message, isError = false) {
      statusText.textContent = message;
      statusText.classList.toggle('error', isError);
    }

    async function convertCurrency(event) {
      if (event) event.preventDefault();

      const amount = Number(amountInput.value);
      const from = fromSelect.value;
      const to = toSelect.value;

      if (amountInput.value.trim() === '' || !Number.isFinite(amount) || amount < 0) {
        setStatus('Please enter a valid amount that is zero or greater.', true);
        return;
      }

      if (from === to) {
        result.textContent = formatMoney(amount, to);
        rateText.textContent = `1 ${from} = 1 ${to}`;
        setStatus('Both currencies are the same.');
        return;
      }

      convertButton.disabled = true;
      convertButton.textContent = 'Converting...';
      setStatus('Getting the latest available exchange rate...');

      try {
        const response = await fetch(`https://open.er-api.com/v6/latest/${encodeURIComponent(from)}`);
        if (!response.ok) throw new Error('The exchange-rate service is unavailable.');

        const data = await response.json();
        if (data.result !== 'success' || !data.rates || typeof data.rates[to] !== 'number') {
          throw new Error('Could not find a rate for this currency pair.');
        }

        const rate = data.rates[to];
        result.textContent = formatMoney(amount * rate, to);
        rateText.textContent = `1 ${from} = ${new Intl.NumberFormat('en', {
          maximumFractionDigits: 6
        }).format(rate)} ${to}`;

        const updated = data.time_last_update_utc
          ? new Date(data.time_last_update_utc).toLocaleString()
          : 'time not provided';
        setStatus(`Rate data last updated: ${updated}.`);
      } catch (error) {
        result.textContent = 'Unable to convert';
        rateText.textContent = 'Please check your internet connection and try again.';
        setStatus(error.message || 'Something went wrong. Please try again.', true);
      } finally {
        convertButton.disabled = false;
        convertButton.textContent = 'Convert currency →';
      }
    }

    form.addEventListener('submit', convertCurrency);

    swapButton.addEventListener('click', () => {
      const previousFrom = fromSelect.value;
      fromSelect.value = toSelect.value;
      toSelect.value = previousFrom;
      convertCurrency();
    });

    fromSelect.addEventListener('change', () => {
      if (fromSelect.value === toSelect.value) {
        const other = [...toSelect.options].find(option => option.value !== fromSelect.value);
        if (other) toSelect.value = other.value;
      }
      convertCurrency();
    });

    toSelect.addEventListener('change', () => {
      if (toSelect.value === fromSelect.value) {
        const other = [...fromSelect.options].find(option => option.value !== toSelect.value);
        if (other) fromSelect.value = other.value;
      }
      convertCurrency();
    });

    amountInput.addEventListener('change', convertCurrency);
    convertCurrency();
  </script>
</body>
</html>
